name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Raw CI logs are not reachable from every environment, so failures are also emitted as
      # workflow annotations and as a commit comment.
      - name: Compile and assemble the debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E "^e: " build.log | head -15 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

      - name: Publish compile log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -f build.log ] || { echo "Gradle never started, so there is no compile log."; exit 0; }
          {
            echo "### assembleDebug failed"
            echo '```'
            grep -E "^(e:|w:|FAILURE:|.*FAILED|.*What went wrong|\* )" build.log | head -60
            echo "---- last lines ----"
            tail -30 build.log
            echo '```'
          } > comment.md
          gh api --method POST "/repos/$GH_REPO/commits/${{ github.sha }}/comments" \
            -F body=@comment.md || true

      - name: Run JVM unit tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --stacktrace > test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E "^e: " test.log | head -15 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

      - name: Publish test log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -f test.log ] || { echo "Gradle never started, so there is no test log."; exit 0; }
          {
            echo "### testDebugUnitTest failed"
            echo '```'
            grep -E "^(e:|w:|FAILURE:|.*FAILED|.*What went wrong|\* )" test.log | head -60
            # Gradle only prints the test *name*; the assertion itself lives in the XML.
            echo "---- assertion details ----"
            for report in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$report" ] || continue
              echo "-- $(basename "$report")"
              tr '<' '\n<' < "$report" | grep -E '^(testcase|failure)' | head -40
            done
            echo "---- last lines ----"
            tail -20 test.log
            echo '```'
          } > comment.md
          gh api --method POST "/repos/$GH_REPO/commits/${{ github.sha }}/comments" \
            -F body=@comment.md || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meshdrop-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
