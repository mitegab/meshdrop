name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The whole log (filtered) is echoed into the job summary on failure, which makes CI
      # output reachable through the API even when raw logs are not.
      - name: Compile, lint and assemble the debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > build.log 2>&1
          code=$?
          {
            echo "## assembleDebug (exit $code)"
            echo '```'
            grep -E "^(e:|w:|FAILURE:|.*FAILED|.*error:|.*What went wrong)" build.log | head -80
            echo "… last lines …"
            tail -40 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Run JVM unit tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --stacktrace > test.log 2>&1
          code=$?
          {
            echo "## testDebugUnitTest (exit $code)"
            echo '```'
            grep -E "^(e:|w:|FAILURE:|.*FAILED|.*error:|.*What went wrong)" test.log | head -80
            echo "… last lines …"
            tail -40 test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meshdrop-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
