name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already carries the Android SDK. This step points Gradle at it,
      # accepts the licences and makes sure the one platform this app compiles against is
      # installed — and, unlike a third-party action, it reports what it did, so a failure
      # here is readable from the commit comment below.
      - name: Set up Android SDK
        run: |
          set -eux
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "No cmdline-tools in $SDK, installing them"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "Android SDK ready at $SDK"
          ls "$SDK/platforms"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Raw CI logs are not reachable from every environment, so failures are also emitted as
      # workflow annotations and as a commit comment.
      - name: Compile and assemble the debug APK
        run: |
          set +e
          ./gradlew assembleDebug :cli:installDist --stacktrace > build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E "^e: " build.log | head -15 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

      - name: Publish compile log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "### assembleDebug failed"
            echo '```'
            if [ -f build.log ]; then
              grep -E "^(e:|w:|FAILURE:|.*FAILED|.*What went wrong|\* )" build.log | head -60
              echo "---- last lines ----"
              tail -30 build.log
            else
              echo "Gradle never started: the failure was in an earlier step."
            fi
            echo '```'
          } > comment.md
          gh api --method POST "/repos/$GH_REPO/commits/${{ github.sha }}/comments" \
            -F body=@comment.md || true

      - name: Run JVM unit tests
        run: |
          set +e
          ./gradlew testDebugUnitTest :cli:test --stacktrace > test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E "^e: " test.log | head -15 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

      - name: Publish test log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "### testDebugUnitTest failed"
            echo '```'
            if [ -f test.log ]; then
              grep -E "^(e:|w:|FAILURE:|.*FAILED|.*What went wrong|\* )" test.log | head -60
              # Gradle only prints the test *name*; the assertion itself lives in the XML.
              echo "---- assertion details ----"
              for report in app/build/test-results/testDebugUnitTest/*.xml; do
                [ -f "$report" ] || continue
                echo "-- $(basename "$report")"
                tr '<' '\n<' < "$report" | grep -E '^(testcase|failure)' | head -40
              done
              echo "---- last lines ----"
              tail -20 test.log
            else
              echo "Gradle never started: the failure was in an earlier step."
            fi
            echo '```'
          } > comment.md
          gh api --method POST "/repos/$GH_REPO/commits/${{ github.sha }}/comments" \
            -F body=@comment.md || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meshdrop-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: CLI smoke test
        run: |
          cli/build/install/meshdrop/bin/meshdrop --help
          cli/build/install/meshdrop/bin/meshdrop identity --home "$RUNNER_TEMP/meshdrop-cli" --name "CI desktop"
          cli/build/install/meshdrop/bin/meshdrop queue --home "$RUNNER_TEMP/meshdrop-cli"

      - name: Upload desktop CLI
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meshdrop-cli
          path: cli/build/install/meshdrop/
          if-no-files-found: error
